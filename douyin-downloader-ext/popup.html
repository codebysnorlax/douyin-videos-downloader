<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0F0F12;
      color: #ffffff;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .header img {
      width: 24px;
      height: 24px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .setting-label {
      font-size: 13px;
      color: #A1A1B3;
    }
    /* Toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #2F2F3D;
      transition: .4s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #675FA5;
    }
    input:checked + .slider:before {
      transform: translateX(14px);
    }
    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #4a4a5a;
      text-align: center;
      border-top: 1px solid #1F1F25;
      padding-top: 10px;
    }
    .btn-help {
      display: block;
      width: 100%;
      background: #1F1F25;
      color: #A1A1B3;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 10px;
      text-decoration: none;
      text-align: center;
    }
    .btn-help:hover {
      background: #2F2F3D;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="logo">
    <h1>Douyin Downloader</h1>
  </div>

  <div class="setting-row">
    <span class="setting-label">Show Download Panel</span>
    <label class="switch">
      <input type="checkbox" id="toggle-panel" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span class="setting-label">Auto-detect Videos</span>
    <label class="switch">
      <input type="checkbox" id="toggle-detect" checked>
      <span class="slider"></span>
    </label>
  </div>

  <a href="https://www.douyin.com" target="_blank" class="btn-help">Open Douyin</a>

  <div class="footer">
    Version 1.1.0 • By Snorlax
  </div>

  <script src="popup.js"></script>
</body>
</html>
