schema: spec-driven

context: |
  Repository: Firefox Manifest V3 WebExtension (codebysnorlax/douyin-videos-downloader, v1.5.1).
  Non-negotiable engineering constraints:
  - Zero UI file edits: Do NOT modify popup.html or content/panel.css. Keep all visible popup and floating panel layouts, colors, typography, icons, and animations untouched.
  - Zero third-party dependencies: Do NOT introduce npm dependencies or node_modules. Build and test scripts must use Node.js standard library only.
  - Strict Mozilla AMO compliance: Zero innerHTML, outerHTML, eval, new Function, or dynamic import(). No unused permissions in manifest.json.
  - Tracked docs only: Do NOT reference gitignored data/ files. Only target tracked docs (README.md, CHANGELOG.md, openspec/config.yaml).
  - Single source of truth: content/*.js modules form an acyclic DAG compiled deterministically into content/bundle.js via scripts/build.js.
